
name: Test Dedalus
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
  checks: write
jobs:
  test_via_conda_forge:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-64
          - os: macos-latest
            label: osx-64
    name: Test ${{ github.ref_name }} via conda-forge on ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Setup miniforge
        uses: conda-incubator/setup-miniconda@v2
        with:
          miniforge-version: latest
          auto-activate-base: true
          activate-environment: ""
      - name: Build stack via conda-forge
        shell: bash -l {0}
        run: |
          conda create -y -n dedalus
          conda activate dedalus
          conda env config vars set OMP_NUM_THREADS=1
          conda env config vars set NUMEXPR_MAX_THREADS=1
          conda install -y -c conda-forge dedalus c-compiler cython pip setuptools wheel "h5py=*=mpi*"
          conda uninstall -y --force dedalus
      - name: Checkout repository
        uses: actions/checkout@v2
      - name: Install Dedalus from repository
        shell: bash -l {0}
        run: |
          conda activate dedalus
          CC=mpicc pip install --no-cache --no-build-isolation .
      - name: Test Network MPI support
        if: runner.os == 'Linux'
        shell: bash -l {0}
        run: |
          cd "$HOME"
          conda activate dedalus
          mpi_args=(-n 4)
          mpi_vendor="$(python -c 'from mpi4py import MPI; print(MPI.get_vendor()[0])')"
          if [[ "${mpi_vendor}" == "Open MPI" ]]; then
            mpi_args+=(--oversubscribe)
          fi
          mpiexec "${mpi_args[@]}" python -m pytest -q \
            --pyargs dedalus.tests_parallel -o 'python_files=test_network_*.py'
      - name: Test Dedalus
        shell: bash -l {0}
        run: |
          # Move out of repository to run tests
          cd "$HOME"
          conda activate dedalus
          # Preserve the report even when pytest returns a failure status.
          trap 'if [[ -f dedalus-test-junit.xml ]]; then cp dedalus-test-junit.xml "$GITHUB_WORKSPACE"; fi' EXIT
          python3 -m dedalus test --report
      - name: Report test results
        uses: dorny/test-reporter@v1
        if: (success() || failure()) && hashFiles('dedalus-test-junit.xml') != ''
        with:
          name: Test report (${{ matrix.os }})
          path: dedalus-test-junit.xml
          reporter: java-junit

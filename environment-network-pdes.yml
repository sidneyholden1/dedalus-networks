name: dedalus-network-pdes

channels:
  - conda-forge

dependencies:
  - python=3.12
  - c-compiler
  - cython>=3.0.5
  - mpi=1.0=mpich
  - mpich
  - fftw=*=mpi_mpich_*
  - hdf5=*=mpi_mpich_*
  - h5py=*=mpi_mpich_*
  - mpi4py
  - numpy
  - scipy
  - matplotlib>=3.7
  - pillow
  - xarray
  - numexpr
  - docopt
  - py
  - pytest
  - pytest-benchmark
  - pytest-cov
  - pytest-xdist
  - pip
  - setuptools
  - wheel
